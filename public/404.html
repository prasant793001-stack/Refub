<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Refub</title>
  <script type="text/javascript">
    // Get the requested path from the URL
    const path = window.location.pathname;

    // If the path is not the root, encode it into a query parameter and redirect to the root
    if (path !== '/') {
      window.location.href = `/?path=${encodeURIComponent(path)}`;
    }
  </script>
</head>
<body>
</body>
</html>
